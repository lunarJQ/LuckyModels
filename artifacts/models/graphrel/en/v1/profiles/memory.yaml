name: memory-m1
runtime: onnxruntime
device: cuda
gpu_ids: [0]
execution:
  precision: fp16
  batch_size: 1
  max_length: 120
  intra_op_threads: 1
  inter_op_threads: 1
  instance_count: 1
  warmup: 20
benchmark:
  concurrency: [1, 2]
  request_count: 200
  timeout_ms: 5000
limits:
  gpu_memory_utilization: 0.5
