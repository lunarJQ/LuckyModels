name: latency-l1
runtime: onnxruntime
device: cuda
gpu_ids: [0]
execution:
  precision: fp16
  batch_size: 1
  max_length: 80
  intra_op_threads: 2
  inter_op_threads: 1
  instance_count: 1
  warmup: 50
benchmark:
  concurrency: [1, 2, 4]
  request_count: 500
  timeout_ms: 3000
limits:
  gpu_memory_utilization: 0.65
