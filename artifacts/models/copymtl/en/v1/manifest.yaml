model_id: copymtl-en-webnlg-v1
model_name: CopyMTL
model_family: copymtl
task_type: relation_extraction
language: en
framework: onnxruntime
runtime_adapter: copymtl_adapter
version: v1
dataset_name: webnlg
dataset_split: dev
stage_count: 1
predict_ready: true
backbone: lstm-copy-decoder

artifacts:
  model: artifacts/copymtl.onnx

tokenizer:
  type: words2id_lookup
  vocab_path: tokenizer/words2id.json

labels:
  relation_map: labels/relations2id.json
  schema_path: labels/config_webnlg_from_casrel_50epoch.json
  entity_map: labels/conversion_meta.json

inference:
  max_length: 80
  batch_size: 1

profiles:
  default: profiles/default.yaml
  latency: profiles/latency.yaml
  balanced: profiles/balanced.yaml
  memory: profiles/memory.yaml
  regression: profiles/regression.yaml

deployment_requirements:
  - Encode tokens with words2id and pad sequences to length 80.
  - Preserve greedy decode and grouped action decoding outside ONNX.
  - Map relation and entity action sequences back to triples in Python.

runtime_notes:
  - LuckyModels now includes a stable Python action decoder adapted from the original CopyMTL runtime service.
